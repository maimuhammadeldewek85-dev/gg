const op=s=>{const [l,p]=s.split('|');return `${p?pic(p):''}<span>${l}</span>`};
function ansTxt(c){return c.t=='c'?c.o[c.a]:c.t=='a'?c.i.map((x,i)=>x.split('|')[0]+' → '+c.tg[c.a[i]]).join(', '):c.t=='o'?c.i.map(x=>x.split('|')[0]).join(' → '):c.a.map(i=>'picture '+(i+1)).join(' and ')}
function challenge(c,o={}){return new Promise(async done=>{
 const st={tries:0,hint:0,lock:false,sel:null,map:c.t=='a'?c.i.map(()=>-1):0,seq:[],ms:new Set(),dis:new Set(),ord:c.t=='o'?shuf(c.i):0};
 if(c.t=='o'){while(st.ord.every((v,i)=>v==i))st.ord=shuf(c.i)}
 let who='';if(S.mode==2){const T=S.teams[S.turn%S.teams.length];who=`<div class="who">Team ${T.n}: ${ROLES[(S.run+S.turn)%4]} picks. ${ROLES[(S.run+S.turn+1)%4]} says why.</div>`}
 P.style.display='flex';
 const draw=()=>{let ia='';
  if(c.t=='c')ia=`<div class="ops">${c.o.map((x,i)=>`<div class="op ${st.dis.has(i)?'dim':''}" data-i="${i}">${op(x)}</div>`).join('')}</div>`;
  if(c.t=='m')ia=`<div class="ops">${c.i.map((x,i)=>`<div class="op ${st.ms.has(i)?'sel':''}" data-i="${i}">${op(x)}</div>`).join('')}</div><button class="b g" id="ck">Check</button>`;
  if(c.t=='a')ia=`<div class="ops">${c.i.map((x,i)=>st.map[i]<0?`<div class="op ${st.sel==i?'sel':''}" data-i="${i}">${op(x)}</div>`:'').join('')}</div><div class="tgs">${c.tg.map((t,j)=>`<div class="tg" data-j="${j}"><b>${t}</b><div class="ops">${c.i.map((x,i)=>st.map[i]==j?`<div class="op" data-u="${i}">${op(x)}</div>`:'').join('')}</div></div>`).join('')}</div>`;
  if(c.t=='o')ia=`<div class="ops">${st.ord.map(i=>`<div class="op ${st.seq.includes(i)?'sel':''}" data-i="${i}">${op(c.i[i])}${st.seq.includes(i)?'<b>'+(st.seq.indexOf(i)+1)+'</b>':''}</div>`).join('')}</div>`;
  P.innerHTML=`<div><span class="chip">${c.s}</span> <span class="chip">${o.tag||''}</span></div>${who}<div class="pic">${c.p?pic(c.p):''}</div><h2>${c.q}</h2>${ia}<div class="fb" id="fb"></div>${ST.a?`<div class="chip">Answer: ${ansTxt(c)}</div>`:''}<div>${o.skip?'<button class="b o" id="sk">Skip</button>':''}</div>`;
  P.querySelectorAll('[data-i],[data-j],[data-u]').forEach(e=>e.onclick=()=>pick(e));const k=$('#ck');if(k)k.onclick=check;const s=$('#sk');if(s)s.onclick=()=>{st.lock=true;P.style.display='none';done('skip')}};
 const bad=async(msg)=>{if(st.lock)return;st.tries++;sfx('oops');mood('conf');anim('cfz');$('#fb').textContent='Try again!';if(st.tries>=3){st.lock=true;S.review++;S.res[c.s]=0;const ans=ansTxt(c);P.querySelector('.fb').textContent='Answer: '+ans;await say(`Let us learn it together! ${c.g}`,{mood:'think'});P.style.display='none';done('rev')}else{say(`${pk('bad',DL.bad)} ${msg||''}`,{mood:'conf',wait:false})}};
 const good=async()=>{if(st.lock)return;st.lock=true;S.res[c.s]=S.res[c.s]===0?0:st.tries?1:2;if(S.mode==2&&!st.tries)S.teams[S.turn%S.teams.length].sp++;sfx('chime');anim('cheer');burst(800,480,26,DC);mood('cheer');$('#fb').textContent='Correct!';await say(`${pk('good',DL.good)} ${c.g}`,{mood:'cheer'});P.style.display='none';done('ok')};
 const pick=e=>{if(st.lock)return;const d=e.dataset;
  if(c.t=='c'){const i=+d.i;if(i==c.a)good();else{st.dis.size<c.o.length-2||0;e.classList.add('bad');bad((c.m&&c.m[i])||'')}}
  if(c.t=='m'){const i=+d.i;st.ms.has(i)?st.ms.delete(i):st.ms.add(i);sfx('crystal');draw()}
  if(c.t=='a'){if(d.u!==undefined){st.map[+d.u]=-1}else if(d.i!==undefined){st.sel=+d.i}else if(d.j!==undefined&&st.sel!==null){st.map[st.sel]=+d.j;st.sel=null;sfx('crystal')}draw();if(st.map.every(v=>v>=0)&&!$('#ck')){P.querySelector('.fb').insertAdjacentHTML('beforebegin','<button class="b g" id="ck">Check</button>');$('#ck').onclick=check}}
  if(c.t=='o'){const i=+d.i,x=st.seq.indexOf(i);if(x>=0)st.seq.length=x;else st.seq.push(i);sfx('crystal');draw();if(st.seq.length==c.i.length)check()}};
 const check=()=>{if(st.lock)return;
  if(c.t=='m'){const ok=st.ms.size==c.a.length&&c.a.every(i=>st.ms.has(i));ok?good():bad('Look at the pictures again. Which ones help plants?')}
  if(c.t=='a'){const w=c.i.map((x,i)=>i).filter(i=>st.map[i]!=c.a[i]);if(!w.length)good();else{const n=c.i[w[0]].split('|')[0];w.forEach(i=>st.map[i]=-1);draw();bad(`Check "${n}" again.`)}}
  if(c.t=='o'){const w=st.seq.findIndex((v,i)=>v!=i);if(w<0)good();else{st.seq.length=w;draw();bad(`Step ${w+1} is not right yet.`)}}};
 S.cur={c,st,draw};draw();say(o.intro||pk('start',DL.start),{wait:false,mood:'think'});
 S.hintFn=async()=>{if(st.lock||!ST.h)return;st.hint++;S.hints++;sfx('spell');anim('thk');mood('think');const l=Math.min(st.hint,3);
  if(l==1)say(pk('hint1',DL.hint1)+' '+(c.h1||H0),{wait:false,mood:'think'});else if(l==2)say('Remember our lesson? '+c.h,{wait:false,mood:'think'});
  else{if(c.t=='c'){const w=c.o.map((x,i)=>i).filter(i=>i!=c.a&&!st.dis.has(i));if(w.length>1)st.dis.add(w[0]);draw()}say('Let us take away one wrong idea. You can finish the thinking!',{wait:false,mood:'think'})}}})}
/* ===== STORY FLOW ===== */
const trk=()=>{const g=$('#trk');g.innerHTML='';for(let i=0;i<6;i++){const x=1000+i*68;g.innerHTML+=S.sc.tr=='c'?`<path class="tk" d="M${x} 700l12-40 12 40z"/>`:S.sc.tr=='r'?`<circle class="tk" cx="${x+12}" cy="690" r="16"/>`:`<rect class="tk" x="${x}" y="680" width="52" height="16" rx="3"/>`}}
async function evolve(n){const names=['','','Baby Dragon','First Magic','Wings','Dragon Guardian'];flash();sfx('evolve');cam('egg');await sleep(500);
 if(n==2){sfx('crack');for(let i=0;i<12;i++)burst(800,520,1,['#c6a8ff'],220,1500);setStage(2);sfx('hatch');anim('jp');mood('surp');burst(800,500,50,DC,260)}else{anim('pop');setStage(n);burst(800,480,50,DC,260)}
 await sleep(700);cam('play');mood('happy');
 if(n==2)await say('I did it! I am out! Hello, friend!',{mood:'cheer'});
 if(n==3){ability('Sparks');sfx('spark');burst(850,430,30,['#ffd23f','#ff9f1c'],200);await say('Look! I can make little sparks! Our plant ideas give me power!',{mood:'surp'})}
 if(n==4){ability('Wings');sfx('flap');$('#dr').classList.add('fast');setTimeout(()=>$('#dr').classList.remove('fast'),2200);await say('Wow! My wings are growing! Look at them!',{mood:'cheer'})}
 if(n==5){ability('Guardian Flame');sfx('fanfare');await say('I am the Dragon Guardian! Thank you, friend!',{mood:'cheer'})}}
async function prog(k){const t=document.querySelectorAll('#trk .tk')[k-1];t&&t.classList.add('on');sfx('crystal');burst(1030+k*68,690,16,DC,90);const e=S.sc.ev[k];
 if(e===0){sfx('crack');$('#eg').setAttribute('class','k'+k);anim('shk');await say(k==1?'CRACK! Did you hear that?':'More cracks! Light is coming out!',{mood:'surp'})}
 else if(e){await evolve(e)}else await say(pk('step',DL.step),{mood:'happy'})}
async function surprise(i){if(!ST.s)return;const s=SUR[i];sfx('alert');anim('shk');burst(800,420,20,['#ff7eb6','#ffd23f'],200);await say(s.intro,{mood:s.mood});const r=await challenge(s.c,{skip:true,tag:'Surprise!',intro:'Quick! Use your thinking!'});S.log.push(['surprise'+i,r]);if(r=='skip'){mood('happy');await say('No problem! We can try again later.')}}
async function decide(){hideB();P.style.display='flex';P.innerHTML='<h2>Which way should Sharrar go?</h2><div class="ops"><button class="b" id="d1" style="font-size:24px">Crystal Cave<br><small>One extra puzzle. Get the Crystal Shield.</small></button><button class="b o" id="d2" style="font-size:24px">Sky Path<br><small>Go fast. Get Sky Sense.</small></button></div>';await say('Two ways! You choose where we go!',{wait:false,mood:'think'});
 const v=await new Promise(r=>{$('#d1').onclick=()=>r('cave');$('#d2').onclick=()=>r('sky')});S.path=v;S.log.push(['path',v]);P.style.display='none';
 if(v=='cave'){ability('Crystal Shield');await say('The cave glows! One more crystal puzzle waits inside.',{mood:'surp'});const c=PR[S.run%4];await challenge(c,{tag:'Crystal Cave',intro:'A crystal puzzle! Think with me!'});await say('The Crystal Shield is ours!',{mood:'cheer'})}
 else{ability('Sky Sense');await say('Wind is lifting us! The Sky Path is open!',{mood:'cheer'})}}
async function run(){const L=S.sc.items;S.run=0;for(let k=0;k<L.length;k++){S.k=k;if(S.review>0&&k>0){S.review=0;await say('Let us train that idea again before we go on!',{mood:'think'});await challenge(PR[k%4],{tag:'Practice',intro:'A little practice makes me stronger!'})}
 cam('play');await challenge(L[k],{tag:`Challenge ${k+1} of ${L.length}`});S.done=k+1;S.run++;S.turn++;await prog(k+1);if(k==1)await surprise(S.sc.id=='A'?0:S.sc.id=='B'?1:2);if(k==2)await decide();if(k==3)await surprise(S.sc.id=='A'?2:S.sc.id=='B'?0:1)}
 await finale()}
async function finale(){P.style.display='none';hideB();cam('wide');sfx('whoosh');const d=$('#dg');d.classList.add('fly');sfx('flap');await sleep(900);document.querySelectorAll('.win').forEach((w,i)=>setTimeout(()=>w.classList.add('on'),i*400));for(let i=0;i<8;i++)setTimeout(()=>{burst(R(300,1300),R(150,450),30,DC,200,1500);sfx('spark')},i*700);sfx('fanfare');setTimeout(()=>sfx('applause'),1500);await sleep(6200);d.classList.remove('fly');
 const m=Object.entries(S.res),ok=m.filter(x=>x[1]>0).map(x=>x[0]),rv=m.filter(x=>x[1]===0).map(x=>x[0]);
 const E=$('#end');E.style.display='flex';E.innerHTML=`<h1>Dragon Guardian!</h1><div style="font-size:22px;max-width:700px">Sharrar is the new guardian of the island. ${S.path=='cave'?'The Crystal Shield protects the kingdom.':'Sky Sense helps him watch over it.'}</div><div>Mastered: ${ok.join(', ')||'-'}</div>${rv.length?`<div>Practice more: ${rv.join(', ')}</div>`:''}<div>Hints used: ${S.hints}</div>${S.mode==2?'<div>'+S.teams.map(t=>`Team ${t.n}: ${t.sp} first-try sparks`).join(' | ')+'</div>':''}<div><button class="b g" id="again">Play again</button></div>`;$('#again').onclick=()=>{E.style.display='none';menu()}}
async function begin(){ini();S.sc=SC[sel];S.mode=+$('#md').value;if(S.mode==2)S.teams=[...document.querySelectorAll('#tnm input')].map((i,n)=>({n:i.value||'Team '+(n+1),sp:0}));
 $('#start').style.display='none';$('#hud').style.display='flex';$('#stg').innerHTML=SN.map(n=>`<span class="chip">${n}</span>`).join('');$('#abl').innerHTML='';ac();amb();trk();document.querySelectorAll('.win').forEach(w=>w.classList.remove('on'));$('#eg').setAttribute('class','');
 cam('wide');setStage(S.sc.st0);mood(S.sc.st0==1?'sleep':'happy');await sleep(2600);cam('egg');await sleep(2400);
 if(S.sc.st0==1){sfx('pulse');anim('shk');await sleep(500);sfx('pulse');await say('At last! Someone came to the island!',{mood:'surp'});await say('I am Sharrar. I am stuck inside this egg!');await say(S.sc.intro[0]);await say(S.sc.intro[1])}
 else{cam('play');anim('jp');sfx('hatch');await say('Hello! I am Sharrar!',{mood:'cheer'});await say(S.sc.intro[0]);await say(S.sc.intro[1])}
 hideB();const m=$('#bubble');m.style.display='block';m.style.left='50%';m.style.top='12vh';m.style.transform='translateX(-50%)';m.innerHTML='<div>YOUR MISSION</div><div style="font-size:.8em">Help Sharrar wake up and learn his powers.</div>';sfx('spell');
 await new Promise(r=>{const g=$('#gate');g.style.display='block';g.onclick=()=>{g.style.display='none';m.style.transform='';m.style.display='none';r()}});cam('play');await sleep(900);await run()}
/* ===== MENUS & TEACHER ===== */
let sel=0;
function menu(){$('#start').style.display='flex';$('#hud').style.display='none';P.style.display='none';hideB();cam('wide');$('#scs').innerHTML=SC.map((s,i)=>`<div class="card ${i==sel?'sel':''}" data-i="${i}"><h3>${s.id}: ${s.n}</h3>${s.d}</div>`).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{sel=+c.dataset.i;menu()});mt()}
function mt(){const t=$('#md').value=='2';$('#tn').style.display=t?'inline':'none';$('#tnm').style.display=t?'block':'none';if(t){const n=+$('#tc').value;$('#tnm').innerHTML=Array.from({length:n},(_,i)=>`<input placeholder="Team ${i+1} name" value="${(document.querySelectorAll('#tnm input')[i]||{}).value||''}"> `).join('')}}
$('#md').onchange=$('#tc').onchange=mt;$('#go').onclick=begin;
$('#bHint').onclick=()=>S.hintFn&&S.cur&&P.style.display!='none'?S.hintFn():say('Press me when a puzzle is open!',{wait:false});
$('#bSnd').onclick=()=>{ST.m=ST.e=!(ST.m||ST.e)?1:0;ST.m=ST.e;sync();sv()};$('#bFs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
$('#bT').onclick=()=>{$('#teach').style.display='block';pr()};$('#tX').onclick=()=>$('#teach').style.display='none';
function pr(){$('#tPr').innerHTML=S&&S.sc?`Scenario ${S.sc.id}: ${S.done}/6 done. Stage: ${SN[S.stage-1]}<br>${Object.entries(S.res).map(x=>x[0]+': '+(x[1]==2?'first try':x[1]==1?'with help':'practice')).join('<br>')}${S.teams.map(t=>`<br>Team ${t.n}: ${t.sp}`).join('')}`:''}
function sync(){$('#tH').checked=!!ST.h;$('#tS').checked=!!ST.s;$('#tR').checked=!!ST.rm;$('#tM').checked=!!ST.m;$('#tE').checked=!!ST.e;$('#tV').value=ST.v;$('#tA').checked=!!ST.a;document.body.classList.toggle('rm',!!ST.rm);$('#bHint').style.display=ST.h?'':'none';if(MG)MG.gain.value=ST.v}
[['tH','h'],['tS','s'],['tR','rm'],['tM','m'],['tE','e'],['tA','a']].forEach(([i,k])=>$('#'+i).onchange=e=>{ST[k]=e.target.checked?1:0;sync();sv();if(k=='a'&&S&&S.cur&&P.style.display!='none')S.cur.draw()});
$('#tV').oninput=e=>{ST.v=+e.target.value;sync();sv()};$('#tP').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause';$('#flash').style.cssText=paused?'opacity:.5;background:#000;pointer-events:auto':'opacity:0;pointer-events:none'};
$('#tRs').onclick=()=>location.reload();$('#tRe').onclick=()=>{try{localStorage.removeItem('dh')}catch(e){}location.reload()};
$('#tEx').onclick=()=>$('#tJ').value=JSON.stringify(SC);$('#tIm').onclick=()=>{try{const j=JSON.parse($('#tJ').value);if(!Array.isArray(j)||j.some(s=>!s.items||!s.ev))throw 0;SC.splice(0,SC.length,...j);sel=0;menu();alert('Imported!')}catch(e){alert('That JSON is not a valid question bank.')}};
build();ini();sync();menu();
</script></body></html>
